<!DOCTYPE html>
<html lang="de" data-app="tobo" data-modus="hell">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<title>To Bo</title>
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<!-- Die Gravur der Zaubermünze steht einmal hier und wird überall
     nachgenutzt: Kopfzeile, Preise, Leiste. Ein Messingplättchen auf
     die Spitze gestellt, mit Loch in der Mitte. -->
<svg id="muenzstempel" aria-hidden="true" focusable="false">
  <defs>
    <linearGradient id="muenzgold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F2CA85"/>
      <stop offset="42%" stop-color="#BE8637"/>
      <stop offset="100%" stop-color="#6B4412"/>
    </linearGradient>
    <g id="muenzform">
      <path d="M20 2.6 L37.4 20 L20 37.4 L2.6 20 Z
               M20 14.3 A5.7 5.7 0 1 0 20 25.7 A5.7 5.7 0 1 0 20 14.3 Z"
            fill-rule="evenodd" fill="url(#muenzgold)"/>
      <path d="M20 6.2 L33.8 20 L20 33.8 L6.2 20 Z" fill="none"
            stroke="#5A360D" stroke-width=".9" opacity=".65"/>
      <circle cx="20" cy="20" r="7.4" fill="none" stroke="#5A360D" stroke-width=".9" opacity=".65"/>
      <g fill="none" stroke="#5A360D" stroke-width=".8" opacity=".6">
        <circle cx="20" cy="9.4" r="2.1"/><circle cx="30.6" cy="20" r="2.1"/>
        <circle cx="20" cy="30.6" r="2.1"/><circle cx="9.4" cy="20" r="2.1"/>
        <path d="M20 6.9v5M17.5 9.4h5M28.1 20h5M30.6 17.5v5M20 28.1v5M17.5 30.6h5M6.9 20h5M9.4 17.5v5"/>
      </g>
    </g>
  </defs>
</svg>

<div id="shell">
  <header>
    <div class="kopftitel" id="kopftitel">To Bo</div>
    <div class="headright">
      <button class="beutel" id="beutel" aria-label="Zaubermünzen — zu den Belohnungen">
        <svg class="muenze" viewBox="0 0 40 40" aria-hidden="true"><use href="#muenzform"/></svg>
        <span class="anzahl" id="muenzzahl">0</span>
      </button>
      <button class="iconbtn" id="modusbtn" aria-label="Dunkler Modus">☾</button>
      <button class="iconbtn" id="settingsbtn" aria-label="Einstellungen">✦</button>
    </div>
  </header>

  <main id="main"></main>

  <nav id="nav">
    <button class="tab" data-screen="vorsaetze"><span class="ic">❋</span>VORSÄTZE</button>
    <button class="tab" data-screen="habits"><span class="ic">☾</span>HABITS</button>
    <button class="tab" data-screen="ziele"><span class="ic">✦</span>ZIELE</button>
    <button class="tab" data-screen="skills"><span class="ic">▤</span>SKILLS</button>
    <button class="tab" data-screen="todo"><span class="ic">✔</span>TO DO</button>
  </nav>
</div>

<div id="modal" class="modal" hidden><div class="modalblatt" id="modalblatt"></div></div>

<script src="js/storage.js"></script>
<script src="js/app.js"></script>
</body>
</html>
